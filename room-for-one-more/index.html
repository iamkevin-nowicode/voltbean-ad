// ---- PAINT: a watercolour kit for Canvas 2D. Washes are built the way a painter glazes: many thin, slightly different
// transparent layers of the same shape, each edge pushed around by recursive midpoint displacement. Where the layers
// overlap the pigment is dense; at the ragged rim it thins out and bleeds. A darker rim is added where water pooled.
const Paint = (() => {
  const g = R => (R() + R() + R() - 1.5) / 1.5;  // cheap gaussian-ish, -1..1

  // pts: [[x,y],...] closed. Returns a new ring with every edge split `depth` times and pushed sideways.
  function deform(pts, depth, amt, R) {
    let out = pts.map(p => [p[0], p[1], p[2] === undefined ? 1 : p[2]]);
    for (let d = 0; d < depth; d++) {
      const nx = [];
      for (let i = 0; i < out.length; i++) {
        const a = out[i], b = out[(i + 1) % out.length];
        nx.push(a);
        const len = Math.hypot(b[0] - a[0], b[1] - a[1]), v = (a[2] + b[2]) * 0.5;
        nx.push([(a[0] + b[0]) / 2 + g(R) * len * amt * v, (a[1] + b[1]) / 2 + g(R) * len * amt * v, clamp(v * (0.75 + R() * 0.5), 0.05, 3)]);
      }

    const base = deform(pts, o.depth || 3, o.rough === undefined ? 0.22 : o.rough, R);
    if (o.bleed) { ctx.save(); ctx.filter = `blur(${o.bleed}px)`; ctx.fillStyle = css(col, a * 3); path(ctx, base); ctx.fill(); ctx.restore(); }
    ctx.fillStyle = css(col, a);
    for (let i = 0; i < layers; i++) { path(ctx, deform(base, o.sub || 2, o.spread || 0.16, R)); ctx.fill(); }
    if (o.edge) {   // pigment pooled at the drying edge
      ctx.save(); ctx.strokeStyle = css(shade(col, o.edgeK || 0.78), o.edge); ctx.lineWidth = o.edgeW || 1.6; ctx.lineJoin = 'round';
      ctx.filter = 'blur(0.6px)'; path(ctx, deform(base, 1, 0.05, R)); ctx.stroke(); ctx.restore();
    }

  function dab(ctx, x, y, rx, ry, col, o = {}) {
    const n = o.n || 12, pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * TAU; pts.push([x + Math.cos(a) * rx, y + Math.sin(a) * ry]); }
    return wash(ctx, pts, col, Object.assign({ layers: 9, alpha: 0.09, depth: 2, sub: 1, rough: 0.3, spread: 0.2 }, o));
  }

  function stroke(ctx, pts, w, col, o = {}) {

        if (i === 0 || R() < 0.06) ctx.moveTo(x, y); else ctx.lineTo(x, y);

// ---- PHYSICS: springs (for weight, overlap and follow-through), ballistic jumps under real gravity, smooth
// accelerate-cruise-decelerate travel, and a stepping system that plants feet on the ground and keeps them there.
const Phys = (() => {
  const G = 2150;                     // gravity in px/s^2 (a fox kit is about 0.5 m, 1 m is about 220 px)
  class Spring {
    constructor(x, f, z) { this.x = x; this.v = 0; this.set(f, z); }
    set(f, z) { const w = TAU * f; this.k = w * w; this.c = 2 * z * w; return this; }
    step(target, dt, extra = 0) { const a = this.k * (target - this.x) - this.c * this.v + extra; this.v += a * dt; this.x += this.v * dt; return this.x; }
  }
  // a jump from p0 at t0 to p1 at t1 under gravity: [x, y, vy]
  function ballistic(p0, p1, t0, t1, t) {
    const T = t1 - t0, tau = clamp(t - t0, 0, T), vy = (p1[1] - p0[1] - 0.5 * G * T * T) / T;
    return [lerp(p0[0], p1[0], tau / T), p0[1] + vy * tau + 0.5 * G * tau * tau, vy + G * tau];
  }
  const apex = T => G * T * T / 8;
  // travel from x0 to x1 between t0 and t1: speed eases up over `ramp` s, cruises, eases down. Returns [x, v].
  function cruise(t, t0, t1, x0, x1, ramp) {
    const T = t1 - t0, a = Math.min(ramp, T / 2), V = (x1 - x0) / (T - a), tau = clamp(t - t0, 0, T);
    const S = q => q * q * q - q * q * q * q / 2, s = q => q * q * (3 - 2 * q);
    if (tau <= a) return [x0 + V * a * S(tau / a), V * s(tau / a)];
    if (tau < T - a) return [x0 + V * (a / 2 + tau - a), V];
    const q = (T - tau) / a; return [x0 + V * (T - a - a * S(q)), V * s(q)];
  }

  // ---- feet. Each foot is planted on the ground in world space and stays there while the body passes over it.
  // When the body has moved far enough that a foot is stretched behind, it lifts, swings forward in an arc and lands
  // ahead. Trot: diagonal pairs swing together. Walk: one foot at a time, hind-fore-hind-fore. Stopping = settle steps.
  class Gait {
    constructor(o) { this.o = o; this.feet = o.feet.map(f => Object.assign({ p: null, sw: null, lift: 0 }, f)); this.events = []; this.seq = 0; this.lastStart = -9; }
    ideal(f, b) { const x = b.x + b.face * f.home + b.vx * this.o.lead; return [x, hillY(x)]; }
    plant(b) { for (const f of this.feet) { const x = b.x + b.face * f.home; f.p = [x, hillY(x)]; f.sw = null; f.lift = 0; } }
    update(t, dt, b) {
      const o = this.o, moving = Math.abs(b.vx) > 6;
      for (const f of this.feet) if (f.sw) {      // swinging feet
        const u = (t - f.sw.t0) / f.sw.dur;
        if (u < 0.7) f.sw.to = this.ideal(f, b);
        if (u >= 1) { f.p = [f.sw.to[0], hillY(f.sw.to[0])]; f.sw = null; f.lift = 0; this.events.push({ t, x: f.p[0], y: f.p[1], who: o.who, id: f.id }); continue; }
        const e = ease.sine(u), x = lerp(f.sw.from[0], f.sw.to[0], e), d = Math.abs(f.sw.to[0] - f.sw.from[0]);
        f.lift = Math.sin(Math.PI * u);
        const h = o.lift * clamp(d / o.stride + 0.25, 0.3, 1) * Math.pow(f.lift, 0.85);
        f.p = [x, Math.min(lerp(f.sw.from[1], f.sw.to[1], e) - h, hillY(x) - 0.5)];
      }
      const err = f => Math.abs(this.ideal(f, b)[0] - f.p[0]);
      const thr = moving ? o.stride * 0.5 : o.settle, start = f => { f.sw = { t0: t, dur: o.dur * (moving ? 1 : 0.8), from: f.p.slice(), to: this.ideal(f, b) }; this.lastStart = t; };
      if (o.pattern === 'trot') {
        if (this.feet.some(f => f.sw) || t - this.lastStart < o.dur * 0.6) return;
        const g = [0, 1].map(k => Math.max(...this.feet.filter(f => f.group === k).map(err)));
        const k = g[0] >= g[1] ? 0 : 1;
        if (g[k] > thr) this.feet.filter(f => f.group === k).forEach(start);
      } else {
        const sw = this.feet.filter(f => f.sw);
        if (sw.length >= 2) return;
        if (sw.length && sw.some(f => (t - f.sw.t0) / f.sw.dur < o.overlap)) return;
        const free = f => !f.sw && !this.feet.some(q => q.sw && q.side === f.side);
        if (moving) {                    // walking: strictly hind, fore, hind, fore (a fore foot may lift as its hind foot lands)
          if (t - this.lastStart > o.dur * 1.5) {     // setting off: begin with whichever foot is most stretched
            let k = 0; o.order.forEach((fi, j) => { if (err(this.feet[fi]) > err(this.feet[o.order[k]])) k = j; }); this.seq = k; }
          const f = this.feet[o.order[this.seq]];
          if (!f.sw && err(f) > thr) { start(f); this.seq = (this.seq + 1) % 4; }
          else { const over = this.feet.filter(q => !q.sw && err(q) > thr * 1.5).sort((p, q) => err(q) - err(p))[0];   // a foot left far behind catches up
            if (over) { start(over); this.seq = (o.order.indexOf(this.feet.indexOf(over)) + 1) % 4; } }
        } else {                         // standing: tidy up whichever feet were left stretched
          for (let k = 0; k < 4; k++) { const f = this.feet[o.order[(this.seq + k) % 4]];
            if (free(f) && err(f) > thr) { start(f); this.seq = (this.seq + k + 1) % 4; break; } }
        }
      }
    }
  }
  return { G, Spring, ballistic, apex, cruise, Gait };
})();

// ---- GLOW: everything that gives off light. Drawn into small canvases that are added on top of the paint:
// sky (moon, stars, aurora), back (tree bulbs, far lights answering), front (the lantern flame), and the light map

    // moon: a pale painted disc with a soft halo

// ---- TITLES: hand-lettered words and the red seal, painted once into small canvases. ----
const Titles = (() => {
  const SERIF = '"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Liberation Serif", "DejaVu Serif", serif';

    const w = Math.ceil(ctx.measureText(text).width + size), h = Math.ceil(size * 1.6);
    cv.width = w; cv.height = h; ctx.font = font; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    const R = rng(text.length * 31);
    ctx.save(); ctx.filter = `blur(${size * 0.05}px)`; ctx.fillStyle = css(col, 0.35); ctx.fillText(text, w / 2, h / 2 + 2); ctx.restore();
    for (let i = 0; i < 4; i++) { ctx.fillStyle = css(col, 0.32); ctx.fillText(text, w / 2 + (R() - 0.5) * size * 0.025, h / 2 + (R() - 0.5) * size * 0.025); }
    if (o.sub) { ctx.font = `${Math.round(size * 0.24)}px ${SERIF}`; ctx.fillStyle = css(col, 0.8); ctx.letterSpacing = `${size * 0.04}px`; }

    for (const [c, g] of lines) { ctx.drawImage(c, (w - c.width) / 2, y); y += c.height + (g || 0); }

  }

    const cv = document.createElement('canvas'), ctx = cv.getContext('2d'), font = `${size}px ${SERIF}`; ctx.font = font;
    const sp = spacing || 0, w = Math.ceil(ctx.measureText(text).width + sp * text.length + size), h = Math.ceil(size * 1.8);
    cv.width = w; cv.height = h; ctx.font = font; ctx.textBaseline = 'middle'; ctx.fillStyle = css(col, 0.85);

// ---- MAIN: load, paint the sheets, then play. ?render switches to frame-exact mode for the video renderer. ----
(() => {
  const q = new URLSearchParams(location.search), RENDER = q.has('render');
  const cv = document.getElementById('c'), ld = document.getElementById('ld'), st = document.getElementById('st'), bar = document.querySelector('#bar s'), hud = document.getElementById('hud');
  const mk = s => { const c = document.createElement('canvas'); c.width = W * s; c.height = H * s; const ctx = c.getContext('2d'); ctx._s = s; return ctx; };

    t = clamp(t, 0, FILM - 1e-4);
    const c = camO || Story.camera(t), F = Actors.draw(t, c, A);
    Glow.sky(A.sky, t, c); Glow.back(A.back, t, c, F); Glow.front(A.front, t, c, F); Glow.lightmap(A.light, t, c, F);
    Stage.render(t, c, F, A);

  const say = (s, k) => { if (st) st.textContent = s; if (bar) bar.style.width = (k * 100) + '%'; };
