    (function () {
      const tl = gsap.timeline({ paused: true });

      tl.to("#r-car", { x: CAR_X + SET_END, duration: 0.7, ease: "power2.out" }, 3.6);

      // RUN CYCLE on 3s: legs and arm swap drawings 10x a second, body bobs.
      tl.fromTo("#r-legs-a", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "steps(1)", repeat: 36, yoyo: true }, 0);
      tl.fromTo("#r-legs-b", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "steps(1)", repeat: 36, yoyo: true }, 0);
      tl.fromTo("#r-arm-a", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "steps(1)", repeat: 36, yoyo: true }, 0);
      tl.fromTo("#r-arm-b", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "steps(1)", repeat: 36, yoyo: true }, 0);
      tl.fromTo("#r-dad-all", { y: 0, rotation: 6, svgOrigin: "220 700" },
        { y: -14, rotation: 6, svgOrigin: "220 700", duration: 0.1, ease: "steps(1)", repeat: 36, yoyo: true }, 0);

      tl.set("#r-fly-toast", { opacity: 0 }, 0);
      // GAG 1 (0.55–0.8): toast leaves the toaster and lands in his grin
      tl.set("#r-fly-toast", { opacity: 1 }, 0.55);
      tl.fromTo("#r-fly-toast", { x: 0, y: 0, rotation: 0 },
        { x: -170, duration: 0.25, ease: "none" }, 0.55);
      tl.to("#r-fly-toast", { y: -260, duration: 0.12, ease: "power2.out" }, 0.55);
      tl.to("#r-fly-toast", { y: -150, duration: 0.13, ease: "power2.in" }, 0.67);
      tl.to("#r-fly-toast", { rotation: -300, duration: 0.25, ease: "steps(4)" }, 0.55);
      tl.set("#r-fly-toast", { opacity: 0 }, 0.8);
      tl.set("#r-mouth-toast", { opacity: 1 }, 0.8);

      // GAG 2 (1.4–1.7): the tie spins itself tight
      tl.fromTo("#r-tie", { rotation: 0, scaleY: 1, svgOrigin: "215 296" },
        { rotation: 720, svgOrigin: "215 296", duration: 0.3, ease: "steps(6)" }, 1.4);
      tl.to("#r-tie", { scaleY: 0.86, svgOrigin: "215 296", duration: 0.07, ease: "steps(1)" }, 1.7);

      // GAG 3 (2.1): the briefcase snaps into his hand
      tl.fromTo("#r-case", { opacity: 0, x: -200, y: -120 },
        { opacity: 1, x: 0, y: 0, duration: 0.12, ease: "power3.out" }, 2.0);

      // GAG 4 (2.6): the hat drops onto his spikes
      tl.set("#r-hat", { opacity: 1 }, 2.48);
      tl.fromTo("#r-hat", { y: -240 }, { y: 0, duration: 0.12, ease: "power3.in" }, 2.48);
      tl.to("#r-hat", { scaleY: 0.85, svgOrigin: "212 62", duration: 0.06, ease: "steps(1)", yoyo: true, repeat: 1 }, 2.6);

      // GAG 5 (2.95): the front door flies open just before he reaches it
      tl.fromTo("#r-door", { scaleX: 1, svgOrigin: "10 0" },
        { scaleX: 0.12, svgOrigin: "10 0", duration: 0.1, ease: "steps(2)" }, 2.9);

      // GAG 6 (3.75–4.3): he leaps into the convertible as it rolls under him
      tl.to("#r-dad", { x: 300, duration: 0.55, ease: "power1.inOut" }, 3.75);
      tl.to("#r-dad", { y: -170, duration: 0.25, ease: "power2.out" }, 3.75);
      tl.to("#r-dad", { y: 200, duration: 0.3, ease: "power2.in" }, 4.0);
      tl.set(["#r-legs-a", "#r-legs-b", "#r-case"], { opacity: 0 }, 4.25);

      // TAKE-OFF (4.5): car and driver accelerate out of frame
      tl.to("#r-car", { x: CAR_X + SET_END + 2200, duration: 0.45, ease: "power3.in" }, 4.5);
      tl.to("#r-dad", { x: 2500, duration: 0.45, ease: "power3.in" }, 4.5);
      tl.fromTo("#r-lines", { scaleX: 0, opacity: 1, svgOrigin: "1020 760" },
        { scaleX: 1, svgOrigin: "1020 760", duration: 0.2, ease: "power2.out" }, 4.68);
      tl.to("#r-lines", { scaleX: 0, svgOrigin: "1900 760", duration: 0.3, ease: "power2.in" }, 5.0);
      tl.fromTo("#r-puffs circle", { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.2, ease: "steps(3)", stagger: 0.05 }, 4.7);
      tl.to("#r-puffs circle", { scale: 0, duration: 0.3, ease: "steps(3)", stagger: 0.05 }, 5.1);

      // THE LINE (5.25): banner snaps in on a back-out, the script is brushed on, then holds dead still
      tl.fromTo("#r-banner", { scale: 0.3, rotation: -6, transformOrigin: "50% 50%" },
        { scale: 1, rotation: -2, duration: 0.3, ease: "back.out(1.8)" }, 5.25);

        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power1.inOut" }, 5.4);

      // TILT UP (7.5): the camera tilts to the sky; everything drops out the bottom

      window.__timelines["rush"] = tl;
    })();
