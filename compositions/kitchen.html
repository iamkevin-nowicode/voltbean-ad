    (function () {
      const tl = gsap.timeline({ paused: true });

      // CAMERA: same truck speed as the hall, then it eases to a stop on the can.

      // WIPE OUT: the pillar keeps travelling at the same speed it came in with.
      tl.fromTo("#k-pillar", { x: -120 }, { x: -2300, duration: 0.4, ease: "none" }, 0);

      // TOASTER POPS (t=1.0): up on the anticipation, arc onto sleeping Dad's head.

        { x: 0, y: -20, duration: 0.12, ease: "power2.out" }, 1.0);
      tl.to("#k-toast", { x: 470, duration: 0.5, ease: "none" }, 1.12);
      tl.to("#k-toast", { y: -230, duration: 0.22, ease: "power2.out" }, 1.12);
      tl.to("#k-toast", { y: -112, duration: 0.28, ease: "power2.in" }, 1.34);
      tl.to("#k-toast", { rotation: 360, duration: 0.5, ease: "steps(6)" }, 1.12);
      // lands with a squash on its own 2s, Dad does not wake up
      tl.to("#k-toast", { scaleY: 0.8, scaleX: 1.12, transformOrigin: "50% 100%", duration: 0.07, ease: "steps(1)" }, 1.62);
      tl.to("#k-toast", { scaleY: 1, scaleX: 1, duration: 0.07, ease: "steps(1)" }, 1.69);

      // DAD: snoring mouth breathes on 3s
      tl.fromTo("#k-dad-snore", { attr: { ry: 7 } },
        { attr: { ry: 14 }, duration: 0.6, ease: "steps(2)", repeat: 6, yoyo: true }, 0);

      // MOM: the pour wobbles on 2s, the puddle grows in three drawings
      tl.fromTo("#k-pour", { rotation: 0, svgOrigin: "232 220" },
        { rotation: 4, svgOrigin: "232 220", duration: 0.2, ease: "steps(1)", repeat: 15, yoyo: true }, 1.6);
      tl.fromTo("#k-puddle", { attr: { rx: 40 } }, { attr: { rx: 150 }, duration: 3.0, ease: "steps(5)" }, 1.8);

      // TITLES: words drop in 3 frames apart, land dead still, leave on a blur.
      tl.fromTo("#k-title-1 b", { opacity: 0, y: -40 },
        { opacity: 1, y: 0, duration: 0.22, ease: "expo.out", stagger: 0.1 }, 1.72);
      tl.to("#k-title-1", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 3.0);
      tl.fromTo("#k-title-2 b", { opacity: 0, y: -40 },
        { opacity: 1, y: 0, duration: 0.22, ease: "expo.out", stagger: 0.1 }, 3.32);
      tl.to("#k-title-2", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 4.7);

      window.__timelines["kitchen"] = tl;
