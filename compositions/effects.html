  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // a whip between two panels: the outgoing one accelerates out, the incoming one
      // arrives at the same speed and decelerates, so the cut sits on the fastest frame
      function whip(outSel, inSel, t) {
        tl.fromTo(outSel, { x: 0 }, { x: -1920, duration: 0.22, ease: "power3.in" }, t - 0.22);
        tl.fromTo(inSel, { x: 1920 }, { x: 0, duration: 0.34, ease: "power3.out" }, t - 0.04);
      }

      // ---------- A ----------
      tl.fromTo("#f-head", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 0.05);
      tl.fromTo("#f-inbox", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.15);
      tl.fromTo("#f-envs", { x: 400 }, { x: 0, duration: 0.45, ease: "expo.out" }, 0.0);
      // envelopes fly off the top of the stack, one after another
      tl.to(".f-env", { x: "+=760", y: "-=1100", rotation: 28, transformOrigin: "50% 50%", duration: 0.36, ease: "power3.in", stagger: { each: 0.12, from: "end" } }, 0.45);
      // the counter runs down with them
      const n = { v: 247 };
      tl.to(n, { v: 0, duration: 1.0, ease: "power1.inOut",
        onUpdate: () => { document.getElementById("f-count").textContent = Math.round(n.v); } }, 0.45);
      tl.fromTo("#f-count", { scale: 1 }, { scale: 1.22, duration: 0.07, ease: "power2.out", yoyo: true, repeat: 1 }, 1.45);
      whip("#f-a", "#f-b", 2.2);

      // ---------- B ----------
      tl.fromTo(".f-hline", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.35, ease: "power3.out", stagger: 0.03 }, 2.15);
      tl.fromTo(".f-vline", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.35, ease: "power3.out", stagger: 0.025 }, 2.2);
      tl.fromTo([".f-cal-h", ".f-cal-d"], { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none", stagger: 0.006 }, 2.3);
      tl.fromTo("#f-monday", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 2.4);
      // the marker circles Monday the 9th, then ticks it
      tl.to("#f-ring", { attr: { "stroke-dashoffset": 0 }, duration: 0.32, ease: "power2.inOut" }, 2.8);
      tl.to("#f-check", { attr: { "stroke-dashoffset": 0 }, duration: 0.18, ease: "power2.out" }, 3.1);
      tl.fromTo("#f-handled", { opacity: 0, scale: 1.25, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, 3.12);
      whip("#f-b", "#f-c", 4.3);

      // ---------- C ----------
      tl.fromTo("#f-heart", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 4.3);
      tl.to("#f-ekg", { attr: { "stroke-dashoffset": 0 }, duration: 1.0, ease: "none" }, 4.35);
      tl.fromTo("#f-surround", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 4.75);
      whip("#f-c", "#f-d", 6.1);

      // ---------- D ----------
      tl.fromTo("#f-banner", { scale: 0.3, rotation: -6, transformOrigin: "50% 50%" },
        { scale: 1, rotation: -2, duration: 0.34, ease: "back.out(1.8)" }, 6.12);
      tl.fromTo("#f-banner .line", { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power1.inOut" }, 6.3);

      // the banner collapses to a dot at the frame's centre: the circle that opens the end card
      tl.to("#f-banner", { scale: 0, rotation: 8, transformOrigin: "50% 50%", duration: 0.32, ease: "power3.in" }, 7.62);

      window.__timelines["effects"] = tl;
    })();
  </script>
