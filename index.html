<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-voltage","type":"color","label":"Voltage yellow","default":"#FFE600"},
    {"id":"color-chaos","type":"color","label":"Chaos pink","default":"#FF1F7A"},
    {"id":"color-teal","type":"color","label":"Atomic teal","default":"#1FB5A8"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#0A0A0A"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --color-voltage: #ffe600;
        --color-chaos: #ff1f7a;
        --color-teal: #1fb5a8;
        --color-ink: #0a0a0a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #c79aa2;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      /* Printed-paper grain over every scene: the medium's paper, not an effect. */
      #grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        background-image: url("assets/grain.png");
        background-size: 256px 256px;
        mix-blend-mode: multiply;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
      data-motion-blur="on"
    >
      <!-- ============ SCENES (one per file) ============ -->
      <div id="morning" data-composition-id="morning" data-composition-src="compositions/morning.html"
           data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080" style="z-index: 1"></div>

      <div id="kitchen" data-composition-id="kitchen" data-composition-src="compositions/kitchen.html"
           data-start="5" data-duration="5.5" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080" style="z-index: 2"></div>

      <div id="zap" data-composition-id="zap" data-composition-src="compositions/zap.html"
           data-start="10.5" data-duration="4" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080" style="z-index: 3"></div>

      <div id="rush" data-composition-id="rush" data-composition-src="compositions/rush.html"
           data-start="14.5" data-duration="8" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080" style="z-index: 4"></div>

      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
           data-start="22.5" data-duration="7.5" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080" style="z-index: 5"></div>

      <!-- ============ PAPER GRAIN ============ -->
      <div id="grain" class="clip" data-start="0" data-duration="30" data-track-index="2"
           data-layout-ignore></div>

      <!-- ============ MUSIC SLOT ============
           Drop a 30 s bed here (120 BPM grid: hits land on 0.5 s beats).
           <audio id="music" class="clip" src="assets/music/bed.mp3" data-start="0"
                  data-duration="30" data-track-index="10" data-volume="0.8"
                  data-fade-in="0.4" data-fade-out="1.5"></audio>
      -->

      <!-- ============ SOUND EFFECTS (each has a cause on screen) ============ -->
      <!-- morning: alarm bells rattle, pillar wipe -->
      <audio id="sfx-bell-1" class="clip" src="assets/sfx/click.mp3" data-start="0.1" data-duration="0.37" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-bell-2" class="clip" src="assets/sfx/click.mp3" data-start="0.4" data-duration="0.37" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-bell-3" class="clip" src="assets/sfx/click.mp3" data-start="0.7" data-duration="0.37" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-wipe-1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="4.62" data-duration="0.57" data-track-index="11" data-volume="0.4"></audio>
      <!-- kitchen: toaster pop, toast lands, tension rises into the zap -->
      <audio id="sfx-toast-pop" class="clip" src="assets/sfx/pop.mp3" data-start="6.0" data-duration="0.72" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-toast-land" class="clip" src="assets/sfx/click.mp3" data-start="6.62" data-duration="0.37" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="9.0" data-duration="3.0" data-media-start="2.0" data-track-index="13" data-volume="0.35"></audio>
      <!-- zap: starburst, ring-pull, zap, colour flood, Dad pops up, whip -->
      <audio id="sfx-burst" class="clip" src="assets/sfx/ping.mp3" data-start="10.9" data-duration="1.32" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-tab" class="clip" src="assets/sfx/click.mp3" data-start="11.9" data-duration="0.37" data-track-index="12" data-volume="0.55"></audio>
      <audio id="sfx-zap" class="clip" src="assets/sfx/glitch-1.mp3" data-start="12.0" data-duration="2.64" data-track-index="14" data-volume="0.5"></audio>
      <audio id="sfx-flood" class="clip" src="assets/sfx/sparkle.mp3" data-start="12.05" data-duration="1.8" data-track-index="13" data-volume="0.4"></audio>
      <audio id="sfx-boing" class="clip" src="assets/sfx/pop.mp3" data-start="12.95" data-duration="0.72" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-whip-1" class="clip" src="assets/sfx/whoosh.mp3" data-start="14.15" data-duration="0.57" data-track-index="12" data-volume="0.5"></audio>
      <!-- rush: toast catch, briefcase, hat, door, car, the line, tilt up -->
      <audio id="sfx-catch" class="clip" src="assets/sfx/pop.mp3" data-start="15.3" data-duration="0.72" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-case" class="clip" src="assets/sfx/click.mp3" data-start="16.62" data-duration="0.37" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-hat" class="clip" src="assets/sfx/pop.mp3" data-start="17.1" data-duration="0.72" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-door" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="17.38" data-duration="0.57" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-car" class="clip" src="assets/sfx/whoosh.mp3" data-start="19.0" data-duration="0.57" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-title" class="clip" src="assets/sfx/chime.mp3" data-start="19.8" data-duration="2.54" data-track-index="13" data-volume="0.4"></audio>
      <audio id="sfx-tilt" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="21.98" data-duration="0.57" data-track-index="11" data-volume="0.4"></audio>
      <!-- endcard: the can touches down, the sign-off -->
      <audio id="sfx-land" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="23.95" data-duration="2.12" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-risk" class="clip" src="assets/sfx/ping.mp3" data-start="26.4" data-duration="1.32" data-track-index="11" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
