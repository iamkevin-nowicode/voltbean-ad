<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-voltage","type":"color","label":"Voltage yellow","default":"#FFE600"},
    {"id":"color-chaos","type":"color","label":"Chaos pink","default":"#FF1F7A"},
    {"id":"color-teal","type":"color","label":"Atomic teal","default":"#1FB5A8"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#0A0A0A"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --color-voltage: #ffe600;
        --color-chaos: #ff1f7a;
        --color-teal: #1fb5a8;
        --color-ink: #0a0a0a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #c79aa2;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      /* Printed-paper grain over every scene: the medium's paper, not an effect. */
      #grain {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        background-image: url("assets/grain.png");
        background-size: 256px 256px;
        mix-blend-mode: multiply;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
      data-motion-blur="on"
    >
      <!-- ============ SCENES (one per file; one circle carries the film) ============ -->
      <div id="clock" data-composition-id="clock" data-composition-src="compositions/clock.html"
           data-start="0" data-duration="4.5" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080" style="z-index: 1"></div>

      <div id="cup" data-composition-id="cup" data-composition-src="compositions/cup.html"
           data-start="4.5" data-duration="5" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080" style="z-index: 2"></div>

      <div id="can" data-composition-id="can" data-composition-src="compositions/can.html"
           data-start="9.5" data-duration="5.5" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080" style="z-index: 3"></div>

      <div id="effects" data-composition-id="effects" data-composition-src="compositions/effects.html"
           data-start="15" data-duration="8" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080" style="z-index: 4"></div>

      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
           data-start="23" data-duration="7" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080" style="z-index: 5"></div>

      <!-- ============ PAPER GRAIN ============ -->
      <div id="grain" class="clip" data-start="0" data-duration="30" data-track-index="2"
           data-layout-ignore></div>

      <!-- ============ MUSIC SLOT ============
           Drop a 30 s bed here (120 BPM grid: hits land on 0.5 s beats).
           <audio id="music" class="clip" src="assets/music/bed.mp3" data-start="0"
                  data-duration="30" data-track-index="10" data-volume="0.8"
                  data-fade-in="0.4" data-fade-out="1.5"></audio>
      -->

      <!-- ============ SOUND EFFECTS (each has a cause on screen) ============ -->
      <!-- clock: the minute hand ticks, the wall floods teal -->
      <audio id="sfx-tick" class="clip" src="assets/sfx/click.mp3" data-start="0.3" data-duration="0.37" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-flood-1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.95" data-duration="0.57" data-track-index="12" data-volume="0.3"></audio>
      <!-- cup: saucer and coffee arrive, the slot-machine word, the drain -->
      <audio id="sfx-saucer" class="clip" src="assets/sfx/pop.mp3" data-start="4.6" data-duration="0.72" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-roll" class="clip" src="assets/sfx/click.mp3" data-start="6.95" data-duration="0.37" data-track-index="12" data-volume="0.45"></audio>
      <audio id="sfx-drain" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="8.8" data-duration="0.57" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="7.45" data-duration="3.0" data-media-start="2.0" data-track-index="13" data-volume="0.35"></audio>
      <!-- can: lid, ring-pull, bolt, colour flood, the turn, starburst, zoom-through -->
      <audio id="sfx-lid" class="clip" src="assets/sfx/pop.mp3" data-start="9.6" data-duration="0.72" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-tab" class="clip" src="assets/sfx/click.mp3" data-start="10.4" data-duration="0.37" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-zap" class="clip" src="assets/sfx/glitch-1.mp3" data-start="10.5" data-duration="2.64" data-track-index="14" data-volume="0.5"></audio>
      <audio id="sfx-flood-2" class="clip" src="assets/sfx/sparkle.mp3" data-start="10.55" data-duration="1.8" data-track-index="13" data-volume="0.4"></audio>
      <audio id="sfx-turn" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="11.25" data-duration="0.57" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-burst" class="clip" src="assets/sfx/ping.mp3" data-start="12.05" data-duration="1.32" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-zoom" class="clip" src="assets/sfx/whoosh.mp3" data-start="14.15" data-duration="0.57" data-track-index="12" data-volume="0.55"></audio>
      <!-- effects: envelopes, zero, whips, the marker, the heartbeat, the banner -->
      <audio id="sfx-envs" class="clip" src="assets/sfx/whoosh.mp3" data-start="15.45" data-duration="0.57" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-zero" class="clip" src="assets/sfx/pop.mp3" data-start="16.45" data-duration="0.72" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-whip-1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="17.0" data-duration="0.57" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-check" class="clip" src="assets/sfx/click.mp3" data-start="18.1" data-duration="0.37" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-whip-2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="19.1" data-duration="0.57" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-beat" class="clip" src="assets/sfx/ping.mp3" data-start="19.55" data-duration="1.32" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-whip-3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="20.9" data-duration="0.57" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-banner" class="clip" src="assets/sfx/chime.mp3" data-start="21.15" data-duration="2.54" data-track-index="13" data-volume="0.4"></audio>
      <!-- endcard: the iris, the can lands, the sign-off -->
      <audio id="sfx-iris" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="22.95" data-duration="0.57" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-land" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="23.6" data-duration="2.12" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-risk" class="clip" src="assets/sfx/ping.mp3" data-start="26.1" data-duration="1.32" data-track-index="11" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
