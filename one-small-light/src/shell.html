<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

canvas#c{position:fixed;inset:0;margin:auto;display:block;width:min(100vw,177.78vh);height:min(56.25vw,100vh)}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f6f0e2;color:#2a3263;font:italic 400 15px/1.4 "Iowan Old Style",Palatino,Georgia,serif;letter-spacing:.04em;transition:opacity .9s;z-index:5;cursor:pointer}
